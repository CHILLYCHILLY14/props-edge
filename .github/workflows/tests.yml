name: Offline safety tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ledger.mjs && node tests/test_eligibility.mjs && node tests/test_simulator.mjs && node tests/test_staking.mjs && node tests/test_sync.mjs && node tests/test_feed_status.mjs
